[package]
name = "velo-world"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Décor réel de velotrace : relief, images aériennes et OpenStreetMap"
license = "MIT"

[dependencies]
velo-core = { path = "../velo-core" }
ureq = { version = "2.12", features = ["native-certs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
earcutr = "0.4"
meshopt = "0.6"
dirs = "6"

[dev-dependencies]
