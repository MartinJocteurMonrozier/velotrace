[package]
name = "velo-ble"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Concentrateur Bluetooth de velotrace : home trainer, capteurs et Zwift Click"
license = "MIT"

[dependencies]
velo-core = { path = "../velo-core" }
btleplug = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
uuid = "1"
